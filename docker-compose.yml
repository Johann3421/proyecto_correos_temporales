services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-airinbox}_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tempmail}
    ports:
      - "${POSTGRES_PORT:-54312}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tempmail}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-airinbox}_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tempmail}
      - DOMAINS=${DOMAINS:-correos.abadgroup.tech}
      - SMTP_HOST=0.0.0.0
      - SMTP_PORT=2525
    ports:
      - "${BACKEND_PORT:-8012}:8000"
      - "${SMTP_REAL_PORT:-25}:2525"    # SMTP Port 25 for real incoming mail
      - "${SMTP_ALT_PORT:-2512}:2525"   # Alternative SMTP port with 12
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-airinbox}_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3012}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
